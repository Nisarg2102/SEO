# Production Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env.production
#   # Fill in all secrets in .env.production
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# Do NOT use this file for local development — use docker-compose.yml instead.
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

# ─── Shared restart policy ───────────────────────────────────────────────────
x-restart: &restart
  restart: unless-stopped

# ─── Shared logging ──────────────────────────────────────────────────────────
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────
  postgres:
    <<: [*restart, *logging]
    image: ankane/pgvector:latest
    container_name: ai_marketing_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: mount custom postgres config for production tuning
      # - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Do NOT expose port 5432 to the host in production.
    # The API connects over the internal Docker network only.
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    container_name: ai_marketing_redis_prod
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ${REDIS_PASSWORD:+"--requirepass ${REDIS_PASSWORD}"} redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ── NestJS API ────────────────────────────────────────────────────────────
  api:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_ENV: production
    image: ${REGISTRY:-local}/ai-marketing-api:${IMAGE_TAG:-latest}
    container_name: ai_marketing_api_prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      AI_MODEL: ${AI_MODEL}
      AI_API_KEY: ${AI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      OPENSEO_URL: ${OPENSEO_URL}
      OPENSEO_API_KEY: ${OPENSEO_API_KEY}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      POSTIZ_URL: ${POSTIZ_URL}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY}
      POSTIZ_WEBHOOK_SECRET: ${POSTIZ_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    # Graceful shutdown: allow 30s for in-flight requests to complete
    stop_grace_period: 30s

  # ── Next.js Web ────────────────────────────────────────────────────────────
  web:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_API_URL is the *public* API URL visible from the browser.
        # In production this is typically your domain, e.g. https://api.yourdomain.com
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: ${REGISTRY:-local}/ai-marketing-web:${IMAGE_TAG:-latest}
    container_name: ai_marketing_web_prod
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 | grep -q html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    stop_grace_period: 30s

  # ── nginx Reverse Proxy ────────────────────────────────────────────────────
  # Terminates TLS, routes /api/* to the NestJS API, everything else to Next.js.
  # Replace with your cloud load balancer (ALB, Cloud Run, Traefik) as needed.
  nginx:
    <<: [*restart, *logging]
    image: nginx:1.27-alpine
    container_name: ai_marketing_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      # Mount TLS certificates — use Let's Encrypt / certbot or your CA
      - ${TLS_CERT_PATH:-./infrastructure/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  # internal: database and API talk here — not exposed to the internet
  internal:
    driver: bridge
    internal: true
  # public: nginx, web, api — nginx exposes ports 80/443
  public:
    driver: bridge
